<!doctype html>
<html lang="en">
  <head>
    <title>UNIPASS - University of Vavuniya Document Portal Walkthrough</title>

    <meta charset="utf-8" />
    <meta
      name="description"
      content="University of Vavuniya Academic Document Management System"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1d4ed8" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700;800&family=JetBrains+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS CDN with plugins -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['"Plus Jakarta Sans"', 'sans-serif'],
              display: ['"Space Grotesk"', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace']
            },
            colors: {
              brand: {
                50: '#eef6ff',
                100: '#d9eaff',
                200: '#bbdcff',
                300: '#8ec5ff',
                400: '#5aa3ff',
                500: '#337df8',
                600: '#1d5feb',
                700: '#1548d8',
                800: '#163bb0',
                900: '#0b3b95',
                950: '#081b4b'
              }
            },
            keyframes: {
              glowPulse: {
                '0%, 100%': {
                  boxShadow:
                    '0 0 25px rgba(56, 189, 248, 0.4), 0 0 50px rgba(30, 96, 226, 0.25)'
                },
                '50%': {
                  boxShadow:
                    '0 0 40px rgba(56, 189, 248, 0.7), 0 0 80px rgba(30, 96, 226, 0.45)'
                }
              },
              clickRipple: {
                '0%': { transform: 'scale(0.8)', opacity: '1' },
                '100%': { transform: 'scale(2.4)', opacity: '0' }
              },
              cursorMove: {
                '0%': { transform: 'translate(10px, 15px)' },
                '50%': { transform: 'translate(0px, 0px) scale(0.95)' },
                '100%': { transform: 'translate(10px, 15px)' }
              }
            },
            animation: {
              glowPulse: 'glowPulse 3s ease-in-out infinite',
              clickRipple:
                'clickRipple 1.2s cubic-bezier(0, 0.2, 0.8, 1) infinite',
              cursorMove: 'cursorMove 2.5s ease-in-out infinite'
            }
          }
        }
      }
    </script>

    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- jsQR CDN for real-time camera & image QR decoding -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

    <link
      rel="icon"
      type="image/png"
      sizes="128x128"
      href="icons/favicon-128x128.png"
    />
    <link rel="icon" type="image/ico" href="favicon.ico" />
  </head>

  <body>
    <!-- quasar:entry-point -->
  </body>
</html>
